# The Hugging Face Space behind the live demo sleeps after 48 h without visitors.
# A request every 6 hours keeps it awake through the judging period (and wakes it if it slept).
name: Keep the demo Space awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the Space
        run: |
          for url in https://roicaluste-wiut-traffic-events.hf.space/ https://roicaluste-wiut-traffic-events.hf.space/config; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url")
            echo "$url -> $code"
          done
